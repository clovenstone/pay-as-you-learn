services:
  postgres:
    image: postgres:16-alpine
    container_name: pay-as-you-learn-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pay_as_you_learn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pay_as_you_learn"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
